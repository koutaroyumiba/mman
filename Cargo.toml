[package]
name = "mman"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Browse custom Markdown manual pages from the command line"
repository = "https://github.com/koutaroyumiba/mman"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
